<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administration — Hôtel Evannath</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#100B06; --bark:#17100A; --bark-2:#1E150D; --bark-3:#2A1E13;
  --bronze:#B98A50; --bronze-2:#DFBB84; --cream:#F6EEE2; --muted:#9C8B78;
  --line:rgba(185,138,80,.18); --palm:#8FAE63; --err:#E08A7B;
  --f-t:"Marcellus",Georgia,serif; --f-b:"Karla",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bark);color:var(--cream);font-family:var(--f-b);font-size:15px;line-height:1.6}
a{color:var(--bronze-2);text-decoration:none}
:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}

/* ── Connexion ─────────────────────────────────────────── */
/* Une lueur bronze derriere la carte : la page de connexion est la premiere
   chose que l hotel voit chaque matin, autant qu elle ait un visage. */
#porte{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1000px 520px at 50% 12%,rgba(185,138,80,.10),
    transparent 62%),var(--bark)}
#porte form{width:100%;max-width:400px;background:var(--bark-2);
  border:1px solid var(--line);padding:40px 36px 36px;text-align:left;
  box-shadow:0 24px 60px rgba(0,0,0,.45)}
#porte .logo{display:block;height:44px;width:auto;margin-bottom:14px}
#porte .devise{font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--bronze);margin-bottom:24px}
#porte h1{font-family:var(--f-t);font-size:25px;font-weight:400;margin-bottom:6px}
#porte p{color:var(--muted);font-size:13.5px;margin-bottom:26px}

/* ── Cadre ─────────────────────────────────────────────── */
#cadre{display:none;min-height:100vh;grid-template-columns:250px 1fr}
#cadre.on{display:grid}
aside{background:var(--night);border-right:1px solid var(--line);padding:26px 0;
  position:sticky;top:0;height:100vh;overflow:auto}
.marque{padding:0 22px 24px;border-bottom:1px solid var(--line);margin-bottom:18px}
.marque img{display:block;height:34px;width:auto;margin-bottom:10px}
.marque span{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--bronze)}
nav h2{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding:20px 24px 8px}
nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;
  color:var(--cream);font:400 14.5px/1.4 var(--f-b);padding:11px 24px;cursor:pointer;
  text-align:left;border-left:2px solid transparent;transition:.18s}
nav button:hover{background:var(--bark-2);color:var(--bronze-2)}
nav button:hover i{color:var(--bronze)}
nav button.on{background:linear-gradient(90deg,rgba(185,138,80,.14),transparent 78%);
  border-left-color:var(--bronze);color:var(--bronze-2)}
nav button.on i{color:var(--bronze-2)}
nav button i{font-style:normal;font-size:15px;width:20px;text-align:center;
  color:var(--muted);transition:.18s}

main{padding:34px 40px 60px;max-width:1100px}
.entete{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
  flex-wrap:wrap;margin-bottom:26px}
h1.t{font-family:var(--f-t);font-size:30px;font-weight:400;line-height:1.15}
/* Un filet bronze sous le titre : la page a une entete, pas seulement un mot. */
h1.t:after{content:"";display:block;width:44px;height:2px;background:var(--bronze);
  margin-top:12px}
.sous{color:var(--muted);font-size:14px;margin-top:4px}

/* ── Blocs ─────────────────────────────────────────────── */
/* Un filet clair en haut du bloc, comme une lumiere rasante : il detache la
   carte du fond sans ombre lourde. */
.carte{background:linear-gradient(180deg,rgba(255,255,255,.022),transparent 120px),
  var(--bark-2);border:1px solid var(--line);padding:24px 26px;margin-bottom:20px}
.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
.chiffre{position:relative;background:var(--bark-2);border:1px solid var(--line);
  padding:22px 24px;overflow:hidden;transition:.25s}
/* Un trait bronze en tete du chiffre : l oeil sait ou commencer. */
.chiffre:before{content:"";position:absolute;top:0;left:0;width:38px;height:2px;
  background:var(--bronze)}
.chiffre:hover{border-color:rgba(185,138,80,.36)}
.chiffre b{font-family:var(--f-t);font-size:34px;color:var(--bronze);display:block;line-height:1}
.chiffre span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  font-weight:700;display:block;margin-top:8px}

.alerte{border-left:3px solid var(--err);background:rgba(224,138,123,.07);padding:16px 20px;margin-bottom:22px}
.alerte b{color:var(--err);display:block;margin-bottom:4px}
.alerte span{font-size:13.5px;color:#D6CBBB}

/* ── Listes ────────────────────────────────────────────── */
.ligne{display:flex;align-items:center;gap:16px;background:var(--bark-2);
  border:1px solid var(--line);padding:14px 18px;margin-bottom:10px}
.ligne .vig{width:64px;height:48px;object-fit:cover;background:var(--bark-3);flex:none}
.ligne .txt{flex:1;min-width:0}
.ligne .txt b{font-family:var(--f-t);font-size:16px;font-weight:400;display:block}
.ligne .txt span{font-size:12.5px;color:var(--muted)}
.etat{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  padding:5px 10px;border:1px solid var(--line);white-space:nowrap}
.etat.vif{color:var(--palm);border-color:rgba(143,174,99,.45)}
.etat.dort{color:var(--muted)}
.etat.fini{color:var(--err);border-color:rgba(224,138,123,.4)}

/* ── Boutons et champs ─────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--bronze);
  background:none;color:var(--bronze);font:700 11px/1 var(--f-b);letter-spacing:.18em;
  text-transform:uppercase;padding:14px 24px;cursor:pointer;transition:.3s;font-family:var(--f-b)}
.btn:hover{background:var(--bronze);color:var(--night)}
.btn.plein{background:var(--bronze);color:var(--night)}
.btn.plein:hover{background:var(--bronze-2);border-color:var(--bronze-2)}
.btn.mince{padding:9px 15px;font-size:10px;letter-spacing:.14em}
.rang{display:flex;flex-direction:column;gap:3px;flex:none}

/* ── Formulaire des promotions ──────────────────────────────────────── */
/* Les quatre temps sont numerotes : on sait ou on en est sans compter. */
.etape{position:relative}

/* Le bandeau de page perimee : il doit se voir, pas se deviner. */
.perimee{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:16px 20px;margin-bottom:20px;background:rgba(224,138,123,.10);
  border:1px solid var(--err)}
.perimee b{color:var(--err);flex:none}
.perimee span{flex:1;min-width:220px;font-size:13px;color:var(--sand)}

/* Le fil des etapes : ou l on en est, ce qui reste, et le retour en
   arriere sur ce qui est deja franchi. */
.fil{display:flex;align-items:center;gap:0;list-style:none;margin:0 0 22px;
  padding:0;flex-wrap:wrap}
.fil li{display:flex;align-items:center;gap:8px;font-size:11.5px;
  color:var(--muted);padding-right:14px}
.fil li+li{padding-left:14px;border-left:1px solid var(--line)}
.fil li i{display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;font-style:normal;font-size:11px;font-weight:700;
  border-radius:50%;background:var(--bark-3);color:var(--muted);
  border:1px solid var(--line);flex:none}
.fil li.ici{color:var(--sand);font-weight:600}
.fil li.ici i{background:var(--bronze-2);color:var(--night);
  border-color:var(--bronze-2)}
.fil li.fait{color:var(--bronze-2);cursor:pointer}
.fil li.fait i{color:var(--bronze-2);border-color:rgba(185,138,80,.5)}
.fil li.fait:hover{color:var(--sand)}

/* Le recapitulatif : a gauche ce qui a ete decide, a droite ce que verra
   le client. */
.recap{display:grid;grid-template-columns:1fr minmax(0,280px);gap:26px}
.recap-l{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.recap-l:last-child{border-bottom:0}
.recap-l span{flex:none;width:112px;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:2px}
.recap-l b{font-weight:400;font-size:13.5px}
.apercu-client{position:relative;background:var(--night);
  border:1px solid var(--line);min-height:230px;overflow:hidden}
.apercu-client img{width:100%;height:100%;object-fit:cover;position:absolute;
  inset:0;opacity:.55}
.apercu-client .vide{position:absolute;inset:0;background:var(--bark-3)}
.apercu-client .dessus{position:relative;padding:22px;display:flex;
  flex-direction:column;align-items:flex-start;gap:10px;min-height:230px;
  justify-content:flex-end}

/* Une affiche porte deja son message : la voiler et ecrire par-dessus la
   rend illisible. On la montre entiere, et le rappel passe dessous. */
.apercu-client.affiche{display:flex;flex-direction:column}
.apercu-client.affiche img{position:static;height:auto;object-fit:contain;
  opacity:1}
.apercu-client.affiche .dessus{min-height:0;padding:14px 16px;
  justify-content:flex-start;gap:8px}
.apercu-client .taux{padding:4px 10px;font-size:13px;font-weight:700;
  background:var(--bronze-2);color:var(--night)}
.apercu-client b{font-family:var(--f-display);font-size:20px;font-weight:400;
  color:var(--cream);line-height:1.2}
@media (max-width:820px){ .recap{grid-template-columns:1fr} }
.bloc-t i{display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;margin-right:9px;font-style:normal;font-size:11px;
  font-weight:700;background:var(--bronze-2);color:var(--night);
  border-radius:50%;vertical-align:2px}
.lb{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin:16px 0 6px}
.etape .lb:first-of-type{margin-top:0}

/* Deux options se montrent, elles ne se cherchent pas dans une liste. */
.choix{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choix.trois{grid-template-columns:repeat(3,1fr)}

/* Une ligne de formule : nom, prix, unite, et de quoi la retirer. */
.formule{display:grid;grid-template-columns:1fr 130px 140px 30px;gap:8px;
  align-items:center;margin-bottom:8px}
.formule input,.formule select{margin:0}
.formule .fl{height:34px;font-size:14px}
.pack-l{grid-template-columns:52px 1fr 120px 130px 30px}
/* La vignette dit quelle photo porte le pack, et sert a en changer. */
.vign{width:52px;height:40px;padding:0;overflow:hidden;cursor:pointer;
  background:var(--bark-3);border:1px solid var(--line);display:flex;
  align-items:center;justify-content:center}
.vign img{width:100%;height:100%;object-fit:cover;display:block}
.vign span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted)}
.vign:hover{border-color:var(--bronze-2)}
@media (max-width:720px){
  .formule{grid-template-columns:1fr 1fr;gap:6px}
  .choix.trois{grid-template-columns:1fr}
}
.opt{padding:14px 16px;text-align:left;font-size:13px;cursor:pointer;
  background:var(--bark-3);color:var(--sand);border:1px solid var(--line);
  transition:.2s}
.opt:hover{border-color:var(--bronze-2)}
.opt.on{border-color:var(--bronze-2);background:rgba(185,138,80,.12);
  color:var(--bronze-2);font-weight:600}

.suffixe{display:flex;align-items:stretch}
.suffixe input{flex:1;border-right:0}
.suffixe span{display:flex;align-items:center;padding:0 16px;font-size:12.5px;
  color:var(--muted);background:var(--bark-3);border:1px solid var(--line)}

/* L apercu montre un prix reel : une remise se juge sur un montant. */
.vitrine{margin-top:14px;padding:14px 16px;background:var(--bark-3);
  border:1px solid var(--line);font-size:13.5px}
.vitrine s{color:var(--muted)}
.vitrine .prix{color:var(--bronze-2);font-size:16px;margin-left:6px}
.vitrine .etiq{display:inline-block;margin-left:8px;padding:2px 8px;
  font-size:11px;font-weight:700;background:var(--bronze-2);color:var(--night)}

.radio,.bascule{display:flex;align-items:center;gap:10px;margin:9px 0;
  font-size:13.5px;cursor:pointer}
.chambre{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:5px 0;
  background:var(--bark-3);border:1px solid var(--line);font-size:13.5px;
  cursor:pointer}
.chambre b{font-weight:500;flex:1}
.chambre span{color:var(--muted);font-size:12.5px}
#les-chambres{margin-top:10px}

.paire{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.paire input{margin-bottom:8px}

/* Programmee : ni en ligne, ni terminee. Elle attend son heure. */
.etat.attend{color:var(--bronze-2);border-color:rgba(185,138,80,.45)}

@media (max-width:640px){
  .choix,.paire{grid-template-columns:1fr}
}
.fl{width:26px;height:21px;line-height:1;font-size:9px;cursor:pointer;
  background:var(--bark-3);color:var(--sand);border:1px solid var(--line);
  transition:.2s}
.fl:hover:not([disabled]){background:var(--bronze-2);color:var(--night);
  border-color:var(--bronze-2)}
.fl[disabled]{opacity:.28;cursor:default}
.btn.danger{border-color:rgba(224,138,123,.5);color:var(--err)}
.btn.danger:hover{background:var(--err);color:var(--night)}

label{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:7px}
input,textarea,select{width:100%;background:var(--bark);border:1px solid var(--line);
  color:var(--cream);font:400 14.5px/1.5 var(--f-b);padding:12px 14px}
input:focus,textarea:focus,select:focus{border-color:var(--bronze);outline:none}
textarea{min-height:96px;resize:vertical}
.champ{margin-bottom:18px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.aide{font-size:12px;color:var(--muted);margin-top:6px}

.puces{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:10px}

.grille-img{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;
  max-height:260px;overflow:auto;padding:4px;border:1px solid var(--line);background:var(--bark)}
.grille-img button{border:2px solid transparent;background:none;padding:0;cursor:pointer;display:block}
.grille-img button.on{border-color:var(--bronze)}
.grille-img img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
/* display:grid l emportait sur l attribut hidden : la grille de photos
   s affichait alors que le bouton proposait encore de l ouvrir. */
.grille-img[hidden]{display:none}

/* Les numeros de chambre, par categorie. Le coup d'oeil que la reception a
   demande : avec trente chambres, la liste detaillee ne tient plus a l'ecran,
   et on ne sait plus quelle 25 appartient a quoi. Celle-ci tient en dix
   lignes, quel que soit le nombre de chambres. */
.numeros{border:1px solid var(--line);margin-bottom:20px}
.numeros > div{display:flex;gap:18px;align-items:baseline;padding:11px 16px;
  border-bottom:1px solid var(--line)}
.numeros > div:last-child{border-bottom:0}
.numeros b{font-family:var(--f-t);font-weight:400;font-size:15px;flex:0 0 215px}
.numeros .liste{color:var(--cream);font-size:14.5px;
  font-variant-numeric:tabular-nums;letter-spacing:.03em;line-height:1.7}
/* Un numero barre est hors service. La legende le dit en toutes lettres :
   une couleur et un trait ne se lisent pas tout seuls. */
.numeros s{color:var(--muted);text-decoration-thickness:1px}
.numeros .rien{color:var(--muted)}
@media(max-width:700px){
  .numeros > div{flex-direction:column;gap:5px}
  .numeros b{flex:none}
}

/* La case « Je la prends en ligne ». Sur un ecran etroit — la reception
   travaille au comptoir, souvent sur un telephone — elle ne peut pas rester
   a cote du nom : mesuree a 474 px, elle reduisait le texte a un mot par
   ligne. Elle passe alors dessous, sur toute la largeur. */
.prise{display:flex;align-items:center;gap:9px;margin:0;text-transform:none;
  letter-spacing:0;font-size:13px;color:var(--cream);font-weight:400;
  white-space:nowrap}
.prise input{width:auto}
@media(max-width:700px){
  .ligne.dispo{flex-wrap:wrap}
  .ligne.dispo .txt{flex:1 1 100%}
}

.bloc-t{font-family:var(--f-t);font-weight:400;font-size:19px;margin-bottom:14px}
.depot{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;
  border:1px dashed var(--line);padding:20px;background:var(--bark)}
.depot.survol{border-color:var(--bronze);background:var(--bark-3)}
#apercu{flex:none}
details.plus{border-top:1px solid var(--line);margin-top:24px;padding-top:6px}
details.plus summary{cursor:pointer;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--bronze);font-weight:700;padding:12px 0}
details.plus summary::marker{color:var(--bronze)}

.pied{display:flex;gap:12px;align-items:center;margin-top:24px;flex-wrap:wrap}
.msg{font-size:13.5px}
.msg.bon{color:var(--palm)}
.msg.mal{color:var(--err)}

@media(max-width:860px){
  #cadre.on{grid-template-columns:1fr}
  aside{position:static;height:auto}
  main{padding:24px 20px 50px}
  .duo,.puces{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ── Connexion ─────────────────────────────────────────── -->
<div id="porte">
  <form id="fporte">
    <img class="logo" src="/img/opt/logo-blanc.png" alt="Hôtel Evannath">
    <p class="devise">Le rêve africain</p>
    <h1>Espace d'administration</h1>
    <p>Publiez vos événements, vos promotions et vos campagnes.</p>
    <div class="champ">
      <label for="mdp">Mot de passe</label>
      <input type="password" id="mdp" autocomplete="current-password" required>
    </div>
    <button class="btn plein" style="width:100%;justify-content:center">Entrer</button>
    <p class="msg mal" id="errporte" style="margin-top:14px"></p>
  </form>
</div>

<!-- ── Administration ────────────────────────────────────── -->
<div id="cadre">
  <aside>
    <div class="marque">
      <img src="/img/opt/logo-blanc.png" alt="Hôtel Evannath">
      <span>Administration</span>
    </div>
    <nav id="menu">
      <button data-v="bord" class="on"><i>▦</i>Tableau de bord</button>
      <h2>Gestion</h2>
      <button data-v="disponibilites"><i>▤</i>Disponibilités</button>
      <button data-v="evenements"><i>◆</i>Événements</button>
      <button data-v="promotions"><i>◉</i>Promotions</button>
      <button data-v="campagnes"><i>☀</i>Campagnes saisonnières</button>
      <h2>Médias</h2>
      <button data-v="galerie"><i>▣</i>Galerie</button>
      <h2>Administration</h2>
      <button data-v="parametres"><i>⚙</i>Paramètres</button>
      <button data-v="utilisateurs"><i>◐</i>Utilisateurs</button>
      <h2>&nbsp;</h2>
      <button id="sortir"><i>↩</i>Se déconnecter</button>
    </nav>
  </aside>
  <main id="vue"></main>
</div>

<script>
/* ─────────────────────────────────────────────────────────────────────────
   Une page, six vues. Pas de bibliotheque : l'administration doit survivre a
   ses dependances, et elle n'a que six ecrans.
   ───────────────────────────────────────────────────────────────────────── */
const API = '/api/admin';
let ETAT = { stockage: '', magasin: '', variable: '', evenements: [],
             promotions: [], campagnes: [], images: [], chambres: [] };
/* Quand on choisit la photo d un pack, il faut savoir DE QUEL pack : la
   grille de photos est unique, les packs sont plusieurs. */
let PHOTO_POUR = null;
/* L empreinte du fichier de CETTE page, telle que le serveur la sert.
   Le numero de version du deploiement ne convenait pas : il change des qu on
   met en ligne quoi que ce soit, y compris une correction sur le site public
   qui ne touche pas l administration. Le bandeau apparaissait alors apres
   chaque mise en ligne, sans raison, et un avertissement qui se trompe finit
   par ne plus etre lu.

   Ce qui compte n est pas que le serveur ait change : il est interroge a
   chaque appel, il est donc toujours a jour. Ce qui compte est que le code
   de cette page-ci ait change pendant qu elle etait ouverte — c est le seul
   cas ou recharger sert a quelque chose. */
let EMPREINTE = null;
let PERIMEE = false;

async function verifierEmpreinte() {
  try {
    const r = await fetch('/admin/index.html?e=' + Date.now(),
      { method: 'HEAD', cache: 'no-store' });
    const e = r.headers.get('etag') || r.headers.get('last-modified') || '';
    // Sans empreinte — un serveur local, par exemple — on ne dit rien plutot
    // que d avertir a tort.
    if (!e) return;
    if (EMPREINTE === null) EMPREINTE = e;
    else if (e !== EMPREINTE) PERIMEE = true;
  } catch (err) {
    /* Reseau coupe : ce n est pas une raison de crier au loup. */
  }
}
let CIBLE_DEPOT = 'fond';
let VUE = 'bord';
let EDITE = null;                       // l'entree en cours de modification

const $ = (s, r) => (r || document).querySelector(s);
/* Le champ image porte soit l'URL d'une affiche deposee, soit le nom d'une
   photo du site. */
const srcImage = (v) => (/^https?:/.test(v || '') ? v : '/img/opt/' + v + '.jpg');
const ech = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* ── Disponibilites ────────────────────────────────────────────────────
   Le jour courant, en heure locale. new Date().toISOString() rend le jour
   UTC : a Abidjan les deux coincident, mais une console ouverte depuis
   ailleurs verrait la mauvaise date, et « fermeture passee » se deciderait
   sur le mauvais jour. */
const jourIso = (d) =>
  new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const AUJ = () => jourIso(new Date());

/* Midi, et pas minuit : une date lue a minuit bascule d'un jour des que le
   fuseau recule d'une heure, et la fermeture s'afficherait decalee. */
const enClair = (j) => new Date(j + 'T12:00:00').toLocaleDateString('fr-FR',
  { day: 'numeric', month: 'long', year: 'numeric' });

/** Ce que vise une fermeture : une chambre, une categorie, ou l'hotel. */
function nomCible(cible) {
  if (cible === '*') return "Tout l'hôtel";
  const ch = (ETAT.chambres || []).find((c) => c.id === cible);
  if (ch) {
    const cat = (ETAT.categories || []).find((c) => c.slug === ch.categorie);
    return 'Chambre ' + ch.numero + (cat ? ' · ' + cat.nom : '');
  }
  const cat = (ETAT.categories || []).find((c) => c.slug === cible);
  if (cat) return 'Toutes les ' + cat.nom;
  /* Une chambre retiree laisse ses fermetures derriere elle. Elles ne
     ferment plus rien — la chambre n'existe plus — mais les cacher
     laisserait une ligne fantome impossible a retrouver. */
  return 'Chambre retirée';
}

/** Les nuits d'une fermeture, dites comme la reception les dirait. */
function nuitsEnClair(f) {
  if (!f.fin) return 'À partir du ' + enClair(f.debut) + ', sans date de fin';
  if (f.debut === f.fin) return 'La nuit du ' + enClair(f.debut);
  return 'Du ' + enClair(f.debut) + ' au ' + enClair(f.fin) + ' inclus';
}

async function appel(action, corps, methode) {
  const o = { method: methode || (corps ? 'POST' : 'GET'), headers: {} };
  if (corps) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(corps); }
  const r = await fetch(API + '?a=' + action, o);
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && action !== 'entrer') { montrerPorte(); throw new Error('session'); }
  return { code: r.status, ...j };
}

/* ── Connexion ─────────────────────────────────────────── */
function montrerPorte() {
  $('#porte').style.display = 'grid';
  $('#cadre').classList.remove('on');
}
function montrerCadre() {
  $('#porte').style.display = 'none';
  $('#cadre').classList.add('on');
  charger();
}

$('#fporte').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#errporte').textContent = '';
  const r = await appel('entrer', { mdp: $('#mdp').value });
  if (r.ok) { $('#mdp').value = ''; montrerCadre(); }
  else $('#errporte').textContent = r.message || 'Connexion impossible.';
});

$('#sortir').addEventListener('click', async () => {
  await appel('sortir', {});
  montrerPorte();
});

/* ── Chargement ────────────────────────────────────────── */
async function charger() {
  const [etat, tout, images, categories] = await Promise.all([
    appel('etat'),
    appel('tout'),
    fetch('/donnees/images.json').then((r) => (r.ok ? r.json() : [])).catch(() => []),
    /* Les CATEGORIES et leurs tarifs viennent du site lui-meme : une
       promotion les vise, et personne ne doit les ressaisir a la main.
       A ne pas confondre avec ETAT.chambres, qui porte les chambres
       PHYSIQUES saisies par la reception — la 25, la 26. */
    fetch('/donnees/chambres.json').then((r) => (r.ok ? r.json() : [])).catch(() => []),
  ]);
  ETAT.stockage = etat.stockage;
  ETAT.magasin = etat.magasin;
  ETAT.variable = etat.variable;
  ETAT.maj = etat.maj;
  ETAT.evenements = (tout.donnees && tout.donnees.evenements) || [];
  ETAT.promotions = (tout.donnees && tout.donnees.promotions) || [];
  ETAT.campagnes = (tout.donnees && tout.donnees.campagnes) || [];
  /* Les chambres PHYSIQUES et les nuits fermees. */
  ETAT.chambres = (tout.donnees && tout.donnees.chambres) || [];
  ETAT.fermetures = (tout.donnees && tout.donnees.fermetures) || [];
  ETAT.version = etat.version || '';
  ETAT.panne = etat.panne || '';
  ETAT.fichiers = etat.fichiers || 0;
  await verifierEmpreinte();
  ETAT.categories = categories;
  ETAT.images = images;
  rendre();
}

$('#menu').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-v]');
  if (!b) return;
  VUE = b.dataset.v; EDITE = null;
  [...$('#menu').querySelectorAll('button')].forEach((x) => x.classList.toggle('on', x === b));
  rendre();
});

/* ── Rendu ─────────────────────────────────────────────── */
/* Un bandeau franc plutot qu une note discrete : tant qu on ne recharge pas,
   ce qu on enregistre peut ne pas partir. */
function perimee() {
  if (!PERIMEE) return '';
  return `<div class="perimee">
    <b>Cette page n'est plus à jour.</b>
    <span>Le site a été mis à jour depuis que vous l'avez ouverte. Rechargez
    avant de continuer : sans cela, certains réglages peuvent ne pas être
    enregistrés.</span>
    <button class="btn plein" id="recharger">Recharger</button>
  </div>`;
}

function avertissement() {
  /* Une panne de lecture passe avant tout le reste : sans ce bandeau, on
     lit « Aucun événement » et on croit que tout a disparu. */
  if (ETAT.panne) {
    return `<div class="alerte">
      <b>Le stockage ne répond pas</b>
      <span>${ech(ETAT.panne)} Vos données ne sont pas perdues : elles sont dans le
      magasin, c'est l'accès qui est en défaut. N'enregistrez rien tant que ce
      message est là — vous écririez par-dessus.</span>
    </div>`;
  }
  if (ETAT.stockage === 'durable') return '';
  return `<div class="alerte">
    <b>Mode démonstration</b>
    <span>Le stockage durable n'est pas encore branché : ce que vous enregistrez
    ici disparaîtra au prochain redéploiement. Pour conserver les données,
    ajoutez un magasin Vercel Blob et la variable BLOB_READ_WRITE_TOKEN.</span>
  </div>`;
}

const expire = (e) => e.fin && new Date(e.fin + 'T23:59:59') < new Date();

function etatDe(e, type) {
  // Une promotion a un etat que sa periode dicte : programmee avant,
  // active pendant, terminee apres. Un evenement, lui, expire.
  if (type === 'promotions' || type === 'campagnes') {
    const st = statutPromo(e);
    return '<span class="etat ' + st.cl + '">' + st.mot + '</span>';
  }
  if (e.publie === false) return '<span class="etat dort">Brouillon</span>';
  if (expire(e)) return '<span class="etat fini">Terminé</span>';
  return '<span class="etat vif">En ligne</span>';
}

/** Ce qu'une campagne annonce, en une ligne : combien de packs, et quand. */
/** Le nom que l API attend pour une collection. */
function typeApi(vue) {
  return vue === 'promotions' ? 'promotion'
    : vue === 'campagnes' ? 'campagne' : 'evenement';
}

function resumeCampagne(c) {
  const n = (c.packs || []).length;
  const jour = (v) => (v || '').slice(0, 10).split('-').reverse().join('/');
  return ech(n + ' pack' + (n > 1 ? 's' : '')
    + ((c.debut || c.fin) ? ' · du ' + jour(c.debut) + ' au ' + jour(c.fin) : ''));
}

/** Ce qu'une promotion fait, en une ligne : combien, sur quoi, quand. */
function resumePromo(p) {
  const r = p.remise || {};
  const jourD = (v) => (v || '').slice(0, 10).split('-').reverse().join('/');
  if (r.type === 'formules') {
    const n = (p.formules || []).length;
    return ech(n + ' formule' + (n > 1 ? 's' : '')
      + ((p.debut || p.fin) ? ' · du ' + jourD(p.debut) + ' au ' + jourD(p.fin) : ''));
  }
  const combien = !r.valeur ? 'sans remise'
    : r.type === 'montant' ? '−' + FCFA(r.valeur) : '−' + r.valeur + ' %';
  const c = p.cible || {};
  const surQuoi = c.toutes !== false ? 'toutes les chambres'
    : ((c.chambres || []).length || 0) + ' chambre'
      + (((c.chambres || []).length || 0) > 1 ? 's' : '');
  const jour = (v) => (v || '').slice(0, 10).split('-').reverse().join('/');
  const quand = p.debut || p.fin
    ? ' · du ' + jour(p.debut) + ' au ' + jour(p.fin) : '';
  return ech(combien) + ' sur ' + ech(surQuoi) + ech(quand);
}

function liste(type) {
  const src = type === 'promotions' ? ETAT.promotions
    : type === 'campagnes' ? ETAT.campagnes : ETAT.evenements;
  // « Aucun promotion » trainait depuis le debut : deux des trois noms sont
  // feminins.
  const [art, nom] = type === 'promotions' ? ['Aucune', 'promotion']
    : type === 'campagnes' ? ['Aucune', 'campagne'] : ['Aucun', 'événement'];
  if (!src.length) {
    return `<div class="carte" style="text-align:center;padding:44px">
      <p style="color:var(--muted)">${art} ${nom} pour le moment.</p>
      <button class="btn plein" style="margin-top:18px" data-neuf="${type}">Créer le premier</button>
    </div>`;
  }
  /* L'ordre de la liste est l'ordre du carrousel : la premiere ligne est la
     premiere diapositive. Les fleches le disent en le faisant — pas de champ
     « position » a remplir, pas de numero a se rappeler. */
  return src.map((e, i) => `
    <div class="ligne">
      <div class="rang">
        <button class="fl" data-bouge="haut" data-type="${type}" data-i="${i}"
          ${i === 0 ? 'disabled' : ''} title="Remonter"
          aria-label="Remonter ${ech(e.titre)}">&#9650;</button>
        <button class="fl" data-bouge="bas" data-type="${type}" data-i="${i}"
          ${i === src.length - 1 ? 'disabled' : ''} title="Descendre"
          aria-label="Descendre ${ech(e.titre)}">&#9660;</button>
      </div>
      ${(() => { const im = type === 'campagnes'
          ? (e.visuel || ((e.packs || [])[0] || {}).image) : e.fond;
        return im ? `<img class="vig" src="${ech(srcImage(im))}" alt="">`
                  : '<div class="vig"></div>'; })()}
      <div class="txt">
        <b>${ech(e.titre)}
          ${e.accent ? '<em style="color:var(--bronze-2)">' + ech(e.accent) + '</em>' : ''}</b>
        <span>${type === 'campagnes' ? resumeCampagne(e)
          : type === 'promotions' ? resumePromo(e)
          : ech(e.badge || e.quand || '—') + (e.fin ? ' · se termine le ' + ech(e.fin) : '')}</span>
      </div>
      ${etatDe(e, type)}
      <!-- « Visible sur le site » existait deja, mais a cinq clics au fond de
           l assistant, quand Supprimer etait sous la main. Cette asymetrie
           poussait a supprimer ce qu on voulait seulement mettre de cote. -->
      <button class="btn mince" data-bascule="${ech(e.id)}" data-type="${type}"
        >${e.publie === false ? 'Afficher' : 'Masquer'}</button>
      <button class="btn mince" data-mod="${ech(e.id)}" data-type="${type}">Modifier</button>
      <button class="btn mince danger" data-sup="${ech(e.id)}" data-type="${type}">Supprimer</button>
    </div>`).join('');
}

/* Le formulaire tient en cinq champs.
   L'etablissement communique par des affiches carrees qui portent deja les
   dates, le tarif et le telephone. Lui demander de ressaisir tout cela serait
   lui faire faire le travail deux fois. Le reste est repliable, et vide par
   defaut. */
/* ── Promotions ────────────────────────────────────────────
   Une promotion n'est pas un evenement. Elle porte une remise, un perimetre
   — sur quelles chambres — et une periode qui COMMENCE : un evenement se
   retire, une promotion se programme. Elle a donc son propre formulaire,
   en quatre temps, plutot qu'un champ « reduction » greffe sur celui des
   evenements. */

const FCFA = (n) => Number(n || 0).toLocaleString('fr-FR')
  .replace(/ | /g, ' ') + ' F';

/** La chambre servant d'exemple dans l'apercu : la premiere visee, sinon la
    premiere du catalogue. Une remise se juge sur un prix reel, pas sur un
    pourcentage abstrait. */
function chambreTemoin(cible) {
  const l = ETAT.categories;
  if (!l.length) return null;
  if (cible && !cible.toutes && cible.chambres && cible.chambres.length) {
    const t = l.find((c) => c.slug === cible.chambres[0]);
    if (t) return t;
  }
  return l[0];
}

/** L'etat d'une promotion, lu de sa periode. */
function statutPromo(p) {
  if (p.publie === false) return { cl: 'dort', mot: 'Brouillon' };
  const n = new Date();
  const d = p.debut ? new Date(p.debut) : null;
  const f = p.fin ? new Date(p.fin) : null;
  if (d && n < d) return { cl: 'attend', mot: 'Programmée' };
  if (f && n > f) return { cl: 'fini', mot: 'Terminée' };
  return { cl: 'vif', mot: 'Active' };
}

/** Les packs tels qu ils sont a l ecran. On garde les lignes vides :
    l utilisateur est peut-etre en train de les remplir. Le serveur, lui, les
    ecartera a l enregistrement. */
function packsSaisis() {
  return [...document.querySelectorAll('#packs .formule')].map((d, i) => ({
    nom: (d.querySelector('[data-fn]').value || '').trim(),
    prix: (d.querySelector('[data-fp]').value || '').replace(/[^\d]/g, ''),
    unite: d.querySelector('[data-fu]').value,
    image: ((EDITE.packs || [])[i] || {}).image || '',
  }));
}

function cibleSaisie() {
  const rad = document.querySelector('input[name="cible"]:checked');
  const toutes = !rad || rad.value === 'toutes';
  return {
    toutes,
    chambres: toutes ? [] : [...document.querySelectorAll('[data-ch]:checked')]
      .map((x) => x.dataset.ch),
    services: toutes ? [] : [...document.querySelectorAll('[data-sv]:checked')]
      .map((x) => x.dataset.sv),
  };
}

/** 'AAAA-MM-JJTHH:MM' a partir des deux champs, ou null si la date manque. */
function instantSaisi(quoi) {
  const d = document.getElementById('f-' + quoi + '-date');
  const h = document.getElementById('f-' + quoi + '-heure');
  if (!d || !d.value) return null;
  return d.value + 'T' + ((h && h.value) || (quoi === 'd' ? '00:00' : '23:59'));
}

/** Ce que verront les clients, recalcule a chaque frappe. */
/* Chaque etape n affiche qu une partie des champs. L apercu lit donc l ecran
   quand le champ y est, et EDITE sinon : autrement il tombait des l etape 3,
   ou le champ de la remise n existe plus, et la page perdait son apercu. */
function rafraichirPromo() {
  const e = EDITE || {};
  const r = e.remise || {};

  const btn = document.querySelector('[data-remise].on');
  const type = btn ? btn.dataset.remise : (r.type || 'pourcentage');
  const pct = type !== 'montant';

  const champ = document.getElementById('f-valeur');
  const brut = champ ? champ.value : String(r.valeur || '');
  const v = Math.abs(Math.round(Number(
    (brut || '').replace(/[^\d.]/g, '')))) || 0;

  const cible = document.querySelector('input[name="cible"]')
    ? cibleSaisie() : (e.cible || { toutes: true });

  const vit = document.getElementById('apercu-remise');
  if (vit) {
    const t = chambreTemoin(cible);
    if (!t || !v) {
      vit.innerHTML = '<span class="aide">Indiquez une valeur pour voir le prix'
        + ' remisé.</span>';
    } else {
      const remise = pct ? Math.round(t.prix * Math.min(v, 100) / 100)
                         : Math.min(v, t.prix);
      vit.innerHTML = 'Sur la <b>' + ech(t.nom) + '</b> : <s>' + FCFA(t.prix)
        + '</s> <b class="prix">' + FCFA(t.prix - remise) + '</b> '
        + '<span class="etiq">−'
        + (pct ? Math.min(v, 100) + ' %' : FCFA(Math.min(v, t.prix))) + '</span>';
    }
  }

  const per = document.getElementById('apercu-periode');
  if (per) {
    const d = document.getElementById('f-d-date') ? instantSaisi('d') : e.debut;
    const f = document.getElementById('f-f-date') ? instantSaisi('f') : e.fin;
    const pub = document.getElementById('f-publie');
    const st = statutPromo({ publie: pub ? pub.checked : e.publie !== false,
                             debut: d, fin: f });
    per.innerHTML = (!d && !f)
      ? '<span class="aide">Sans période, la promotion reste affichée tant '
        + "qu'elle est visible.</span>"
      : 'Aujourd’hui : <span class="etat ' + st.cl + '">' + st.mot + '</span>';
  }
}

/* Les trois reglages qui se repondent — type de remise, perimetre,
   periode — doivent se voir immediatement. Sinon on publie une remise
   de 200 % ou une promotion deja terminee sans le savoir. */
let ECOUTE_PROMO = false;
function brancherPromo() {
  const f = $('#vue');
  if (!f) return;
  /* Le conteneur survit aux changements d etape : poser les ecouteurs a chaque
     rendu les empilait, et l apercu se recalculait autant de fois qu on avait
     franchi d etapes. On les pose une seule fois. */
  if (!ECOUTE_PROMO) {
    ECOUTE_PROMO = true;
    f.addEventListener('input', () => { rafraichirPromo(); compterAccroche(); });
    f.addEventListener('change', (ev) => {
      const rad = ev.target.closest('input[name="cible"]');
      if (rad) {
        const l = $('#les-chambres');
        if (l) l.hidden = rad.value !== 'certaines';
      }
      rafraichirPromo();
    });
  }
  rafraichirPromo();
  compterAccroche();
}

/* Combien il reste. Sans ce compte, on decouvrait la coupure une fois publie —
   et on ne la decouvrait meme pas, puisqu elle etait silencieuse. */
function compterAccroche() {
  const t = $('#f-accroche'), p = $('#compte-accroche');
  if (!t || !p) return;
  const n = t.value.length, max = 1200;
  p.textContent = n + ' / ' + max + ' caractères'
    + (n > max ? ' — ' + (n - max) + ' de trop' : '');
  p.style.color = n > max ? 'var(--err)' : '';
}

/** Le type d offre se choisit par trois boutons plutot que par une liste
    deroulante : trois options se montrent, elles ne se cherchent pas.

    Le changement redessine l etape, car la forme de l ecran en depend :
    « formules » n a pas de valeur a saisir, et le fil des etapes annonce
    alors « Les formules » et non « S'applique a ». Se contenter de basculer
    une classe laissait le champ de valeur en place et le fil mentait. */
function choisirRemise(bouton) {
  lireEtape();
  EDITE.remise = EDITE.remise || {};
  EDITE.remise.type = bouton.dataset.remise;
  rendre();
}

/* On publie depuis EDITE, pas depuis l ecran. Au recapitulatif, les champs
   des etapes precedentes n existent plus : les lire faisait echouer la
   publication sur un « classList of null », juste au moment ou l on croyait
   avoir fini. EDITE est la seule source qui traverse les cinq etapes. */
async function enregistrerCampagne() {
  lireEtape();
  const e = EDITE || {};
  const entree = {
    id: e.id,
    titre: e.titre || '',
    visuel: e.visuel || '',
    accroche: e.accroche || '',
    note: e.note || '',
    packs: e.packs || [],
    avant: e.avant === true,
    debut: e.debut || null,
    fin: e.fin || null,
    publie: e.publie !== false,
  };
  const msg = $('#msgf');
  const r = await appel('enregistrer', { type: 'campagne', entree });
  if (!r.ok) { msg.className = 'msg mal'; msg.textContent = r.message || 'Échec.'; return; }
  const st = statutPromo(entree);
  const quand = (v) => (v ? v.slice(8, 10) + '/' + v.slice(5, 7) + '/'
    + v.slice(0, 4) + ' à ' + v.slice(11) : '');
  msg.className = 'msg ' + (st.mot === 'Active' ? 'bon' : 'mal');
  msg.textContent =
    entree.publie === false ? 'Enregistrée en brouillon : elle n’apparaît pas sur le site.'
    : st.mot === 'Programmée'
      ? 'Enregistrée. Elle apparaîtra sur le site le ' + quand(entree.debut) + '.'
    : st.mot === 'Terminée'
      ? 'Enregistrée, mais sa période est déjà passée : elle n’apparaît pas sur le site.'
    : 'Publiée. Elle est visible sur le site dès maintenant.';
  EDITE = null;
  setTimeout(charger, 1400);
}

async function enregistrerPromo() {
  lireEtape();
  const e = EDITE || {};
  const r0 = e.remise || {};
  const entree = {
    id: e.id,
    titre: e.titre || '',
    message: e.message || '',
    fond: e.fond || '',
    format: e.format || 'fond',
    remise: {
      type: r0.type === 'montant' ? 'montant'
        : r0.type === 'formules' ? 'formules' : 'pourcentage',
      valeur: r0.valeur || 0,
    },
    formules: e.formules || [],
    cible: e.cible || { toutes: true },
    debut: e.debut || null,
    fin: e.fin || null,
    publie: e.publie !== false,
    avant: e.avant === true,
    pastille: e.pastille !== false,
  };
  const msg = $('#msgf');
  const r = await appel('enregistrer', { type: 'promotion', entree });
  if (!r.ok) { msg.className = 'msg mal'; msg.textContent = r.message || 'Échec.'; return; }

  /* « Publiée » tout court a induit en erreur : une promotion dont la
     periode commence plus tard n apparait pas sur le site, et rien ne le
     disait. On annonce ce qui va reellement se passer. */
  const st = statutPromo(entree);
  const quand = (v) => v ? v.slice(8, 10) + '/' + v.slice(5, 7) + '/'
    + v.slice(0, 4) + ' à ' + v.slice(11) : '';
  msg.className = 'msg ' + (st.mot === 'Active' ? 'bon' : 'mal');
  msg.textContent =
    entree.publie === false ? 'Enregistrée en brouillon : elle n’apparaît pas sur le site.'
    : st.mot === 'Programmée'
      ? 'Enregistrée. Elle apparaîtra sur le site le ' + quand(entree.debut) + '.'
    : st.mot === 'Terminée'
      ? 'Enregistrée, mais sa période est déjà passée : elle n’apparaît pas '
        + 'sur le site.'
    : 'Publiée. Elle est visible sur le site dès maintenant.';

  EDITE = null;
  setTimeout(charger, 1400);
}

const UNITES = [['forfait', 'le forfait'], ['personne', 'par personne'],
                ['enfant', 'par enfant'], ['nuit', 'par nuit']];

/* Une campagne de formules ne vise pas des chambres : elle EST l offre. La
   troisieme etape change donc de sujet selon la forme choisie a la deuxieme. */
function estCampagne() { return VUE === 'campagnes'; }
function etapes() {
  if (estCampagne()) {
    return ['La campagne', 'Les packs', 'Période & affichage', 'Récapitulatif'];
  }
  return ['Informations générales', 'Réduction', "S'applique à",
          'Période & affichage', 'Récapitulatif'];
}
function nbEtapes() { return etapes().length; }
const ETAPES = { get length() { return 5; } };
let ETAPE = 1;

/* Le fil des etapes. Il ne sert pas a decorer : il dit ou l on en est, ce qui
   reste, et il laisse revenir en arriere sur ce qui est deja franchi. */
function fil() {
  return '<ol class="fil">' + etapes().map((nom, i) => {
    const n = i + 1;
    const cl = n === ETAPE ? 'ici' : (n < ETAPE ? 'fait' : '');
    const clic = n < ETAPE ? ` data-pas="${n}"` : '';
    return `<li class="${cl}"${clic}><i>${n < ETAPE ? '✓' : n}</i>
      <span>${nom}</span></li>`;
  }).join('') + '</ol>';
}

/* Ce que l utilisateur a saisi dans l etape courante, verse dans EDITE avant
   de changer d ecran. Sans cela, passer a l etape suivante perdrait tout ce
   qui vient d etre tape : le formulaire est reconstruit a chaque pas. */
function lireEtape() {
  EDITE = EDITE || { publie: true, remise: {}, cible: { toutes: true } };
  const v = (id) => { const e = $('#' + id); return e ? e.value.trim() : null; };
  const c = (id) => { const e = $('#' + id); return e ? e.checked : null; };

  if (v('f-titre') !== null) EDITE.titre = v('f-titre');
  if (v('f-message') !== null) EDITE.message = v('f-message');

  const btn = document.querySelector('[data-remise].on');
  if (btn) {
    EDITE.remise = EDITE.remise || {};
    EDITE.remise.type = btn.dataset.remise;
    EDITE.remise.valeur = (v('f-valeur') || '').replace(/[^\d.]/g, '');
  }
  if (document.querySelector('input[name="cible"]')) EDITE.cible = cibleSaisie();
  if (document.getElementById('packs')) EDITE.packs = packsSaisis();

  if (v('f-accroche') !== null) EDITE.accroche = v('f-accroche');
  if (v('f-note') !== null) EDITE.note = v('f-note');
  if ($('#f-d-date')) { EDITE.debut = instantSaisi('d'); EDITE.fin = instantSaisi('f'); }
  if (c('f-publie') !== null) EDITE.publie = c('f-publie');
  if (c('f-avant') !== null) EDITE.avant = c('f-avant');
  if (c('f-pastille') !== null) EDITE.pastille = c('f-pastille');
}

/* Ce qui manque pour passer a la suite. On refuse d avancer plutot que de
   laisser decouvrir le probleme au recapitulatif. */
function manqueEtape() {
  if (ETAPE === 1 && !(EDITE.titre || '').trim()) return 'Il manque le titre.';
  if (estCampagne()) {
    if (ETAPE === 2) {
      const ok = (EDITE.packs || []).filter((p) => p.nom && Number(p.prix));
      if (!ok.length) return 'Ajoutez au moins un pack, avec son nom et son prix.';
    }
    return '';
  }
  if (ETAPE === 2) {
    const val = Number((EDITE.remise || {}).valeur || 0);
    if (!val) return 'Indiquez la valeur de la réduction.';
  }
  if (ETAPE === 3 && EDITE.cible && EDITE.cible.toutes === false
      && !(EDITE.cible.chambres || []).length
      && !(EDITE.cible.services || []).length) {
    return 'Choisissez au moins une chambre, ou revenez à « toutes les chambres ».';
  }
  return '';
}

function formulairePromo() {
  const e = EDITE || { publie: true, remise: {}, cible: { toutes: true } };
  const dernier = ETAPE === nbEtapes();
  return `${fil()}

      <h2 class="bloc-t"><i>${ETAPE}</i> ${etapes()[ETAPE - 1]}</h2>
      ${(estCampagne() ? [camp1, camp2, pas4, camp4]

        ? '<button class="btn plein" id="enreg">Publier la promotion</button>'

}

function camp4(e) {
  const jour = (v) => (v ? v.slice(8, 10) + '/' + v.slice(5, 7) + '/' + v.slice(0, 4)

/* Le recapitulatif ne redemande rien : il montre. A gauche ce qui a ete
   decide, a droite ce que verra le client. C est le dernier moment pour voir
   qu une remise vise la mauvaise chambre. */
function pas5(e) {
  const r = e.remise || {};
  const c = e.cible || { toutes: true };
  const noms = {};
  ETAT.categories.forEach((ch) => { noms[ch.slug] = ch.nom; });
  const taux = r.type === 'formules'
      ? ((e.formules || []).filter((f) => f.nom && f.prix).length || 0) + ' formules'
    : !r.valeur ? '—'
    : r.type === 'montant' ? '−' + FCFA(r.valeur) : '−' + r.valeur + ' %';
  const surQuoi = c.toutes !== false ? 'Toutes les chambres'
    : ((c.chambres || []).map((s) => noms[s] || s)
       .concat((c.services || [])).join(', ') || '—');
  const jour = (v) => (v ? v.slice(0, 10).split('-').reverse().join('/')
    + ' à ' + v.slice(11) : '');
  const periode = (e.debut || e.fin)
    ? 'Du ' + jour(e.debut) + ' au ' + jour(e.fin)
    : 'Sans période : affichée tant qu’elle est visible';
  const st = statutPromo(e);
  const ligne = (lb, val) => `<div class="recap-l"><span>${lb}</span><b>${val}</b></div>`;

  return `<div class="recap">
    <div>
      ${ligne('Titre', ech(e.titre || '—'))}
      ${ligne('Message', ech(e.message || '—'))}
      ${(e.remise || {}).type === 'formules'

              + ((UNITES.find((u) => u[0] === f.unite) || UNITES[0])[1]))
            .join('<br>') || '—')
        : ligne('Réduction', taux) + ligne("S'applique à", ech(surQuoi))}
      ${ligne('Période', ech(periode))}
      ${ligne('État', '<span class="etat ' + st.cl + '">' + st.mot + '</span>')}
      ${ligne('Affichage', (e.publie === false ? 'Brouillon' : 'Visible')
        + (e.avant ? ' · en avant sur l’accueil' : '')
        + (e.pastille !== false && (e.remise || {}).type !== 'formules'
           ? ' · badge sur les chambres' : ''))}
    </div>
    <div class="apercu-client${e.format === 'affiche' ? ' affiche' : ''}">
      ${e.fond ? `<img src="${ech(srcImage(e.fond))}" alt="">` : '<div class="vide"></div>'}
      <div class="dessus">
        <span class="taux">${taux}</span>
        <b>${ech(e.titre || '')}</b>
      </div>
    </div>
  </div>`;
}

document.addEventListener('click', async (e) => {
  if (e.target.id === 'recharger') { location.reload(); return; }

  /* Ajouter une chambre. */
  if (e.target.id === 'cn-poser') {
    const msg = $('#cn-msg');
    const dire = (t, mal) => { msg.textContent = t; msg.className = 'msg ' + (mal ? 'mal' : 'bon'); };
    const numero = $('#cn-numero').value.trim();
    if (!numero) return dire('Donnez-lui son numéro.', true);
    dire('Enregistrement…');
    const r = await appel('enregistrer', { type: 'chambre',
      entree: { numero, categorie: $('#cn-cat').value } });
    if (!r.ok) return dire(r.message || "Ça n'a pas pu être enregistré.", true);
    ETAT.chambres = (ETAT.chambres || []).concat([r.entree]);
    rendre();
    /* Le champ reste prêt pour la suivante : on en saisit dix à la file, et
       rendre() vient de redessiner la vue, donc le focus était perdu. */
    const champ = $('#cn-numero');
    if (champ) { champ.value = ''; champ.focus(); }
    return;
  }

  const ote = e.target.closest('[data-oter]');
  if (ote) {
    const ch = (ETAT.chambres || []).find((x) => x.id === ote.dataset.oter);
    if (!ch) return;
    /* Retirer n'est pas fermer, et la différence coûte cher : on la dit. */
    if (!confirm('Retirer la chambre ' + ch.numero + ' ?\n\nElle ne comptera '
      + 'plus dans les disponibilités. Pour une panne ou des travaux, décochez '
      + 'plutôt « En service » : la chambre reste chez vous.')) return;
    const r = await appel('supprimer', { type: 'chambre', id: ch.id });
    if (!r.ok) { alert(r.message || "Ça n'a pas pu être retiré."); return; }
    ETAT.chambres = ETAT.chambres.filter((x) => x.id !== ch.id);
    return rendre();
  }

  /* Fermer des nuits. */
  if (e.target.id === 'ff-poser') {
    const msg = $('#ff-msg');
    const dire = (t, mal) => { msg.textContent = t; msg.className = 'msg ' + (mal ? 'mal' : 'bon'); };
    const debut = $('#ff-debut').value;
    const sansFin = $('#ff-sansfin').checked;
    const fin = $('#ff-fin').value;
    if (!debut) return dire('Indiquez au moins la première nuit fermée.', true);
    if (sansFin && fin) {
      return dire('Choisissez : une dernière nuit, ou aucune date de fin. '
        + 'Pas les deux.', true);
    }
    const entree = { cible: $('#ff-cible').value, debut, fin, sansFin,
                     motif: $('#ff-motif').value };
    dire('Enregistrement…');
    const r = await appel('enregistrer', { type: 'fermeture', entree });
    if (!r.ok) return dire(r.message || "Ça n'a pas pu être enregistré.", true);
    ETAT.fermetures = (ETAT.fermetures || []).filter((x) => x.id !== r.entree.id);
    ETAT.fermetures.push(r.entree);
    rendre();
    return;
  }

  const rouvre = e.target.closest('[data-rouvrir]');
  if (rouvre) {
    const f = (ETAT.fermetures || []).find((x) => x.id === rouvre.dataset.rouvrir);
    if (!f) return;
    /* On nomme ce qu'on retire. « Voulez-vous vraiment ? » ne dit pas ce
       qu'on s'apprête à rouvrir à la réservation. */
    if (!confirm('Rouvrir ' + nomCible(f.cible).toLowerCase() + ' — '
      + nuitsEnClair(f).toLowerCase() + ' ?\n\nLe site cessera d\'annoncer '
      + 'complet sur ces nuits.')) return;
    const r = await appel('supprimer', { type: 'fermeture', id: f.id });
    if (!r.ok) { alert(r.message || "Ça n'a pas pu être retiré."); return; }
    ETAT.fermetures = (ETAT.fermetures || []).filter((x) => x.id !== f.id);
    return rendre();
  }

  const neuf = e.target.closest('[data-neuf]');
  if (neuf) {
    VUE = neuf.dataset.neuf; EDITE = { infos: [], publie: true }; ETAPE = 1;
    [...$('#menu').querySelectorAll('button[data-v]')].forEach(
      (x) => x.classList.toggle('on', x.dataset.v === VUE));
    return rendre();
  }
  const mod = e.target.closest('[data-mod]');
  if (mod) {
    const src = mod.dataset.type === 'promotions' ? ETAT.promotions
      : mod.dataset.type === 'campagnes' ? ETAT.campagnes : ETAT.evenements;
    EDITE = JSON.parse(JSON.stringify(src.find((x) => x.id === mod.dataset.mod)));
    ETAPE = 1;
    EDITE.infos = EDITE.infos || [];
    return rendre();
  }
  /* Deplacer une ligne : on echange avec sa voisine et on envoie l'ordre
     complet. Le serveur reordonne sur cette liste d'identifiants, ce qui
     evite toute notion de position stockee — donc tout risque de trous ou
     de doublons dans la numerotation. */
  const bouge = e.target.closest('[data-bouge]');
  if (bouge) {
    const type = bouge.dataset.type;
    const src = type === 'promotions' ? ETAT.promotions
      : type === 'campagnes' ? ETAT.campagnes : ETAT.evenements;
    const i = Number(bouge.dataset.i);
    const j = bouge.dataset.bouge === 'haut' ? i - 1 : i + 1;
    if (j < 0 || j >= src.length) return;
    const ordre = src.map((x) => x.id);
    ordre.splice(j, 0, ordre.splice(i, 1)[0]);
    const msg = $('#msgl');
    const r = await appel('ordonner', { type: typeApi(type), ordre });
    if (!r.ok) {
      if (msg) msg.textContent = r.message || "L'ordre n'a pas pu être enregistré.";
      return;
    }
    if (msg) msg.textContent = '';
    return charger();
  }

  /* Masquer, c est retirer du site sans rien perdre : l entree reste dans
     l administration, marquee Brouillon, et un clic la remet en ligne.
     Aucune confirmation demandee — le geste est reversible, c est tout son
     interet. */
  const bas = e.target.closest('[data-bascule]');
  if (bas) {
    const type = bas.dataset.type;
    const entree = (ETAT[type] || []).find((x) => x.id === bas.dataset.bascule);
    if (!entree) return;
    bas.disabled = true;
    const copie = JSON.parse(JSON.stringify(entree));
    copie.publie = entree.publie === false;
    const r = await appel('enregistrer', { type: typeApi(type), entree: copie });
    if (!r.ok) {
      bas.disabled = false;
      const m = $('#msgl');
      if (m) m.textContent = r.message || 'Le changement n’a pas pu être enregistré.';
      return;
    }
    return charger();
  }

  const sup = e.target.closest('[data-sup]');
  if (sup) {
    if (!confirm('Supprimer définitivement ?')) return;
    await appel('supprimer', { type: typeApi(sup.dataset.type), id: sup.dataset.sup });
    return charger();
  }
  /* Une image deposee peut aller a trois endroits : l affiche d un
     evenement ou d une promotion, le visuel d une campagne, ou la photo d un
     pack. On retient lequel avant d ouvrir le selecteur de fichier. */
  if (e.target.id === 'choisir') {
    CIBLE_DEPOT = e.target.dataset.vers || 'fond';
    $('#f-fichier').click();
    return;
  }
  if (e.target.id === 'basculer') {
    const g = $('#imgs');
    g.hidden = !g.hidden;
    e.target.textContent = g.hidden ? 'ou choisir une photo du site' : 'masquer les photos du site';
    return;
  }

  /* Passer d une etape a l autre. On verse d abord ce qui vient d etre
     saisi dans EDITE : le formulaire est reconstruit a chaque pas, et
     sans cela tout serait perdu. */
  const pas = e.target.closest('[data-pas]');
  if (pas) {
    lireEtape();
    const ou = pas.dataset.pas;
    if (ou === 'suiv') {
      const manque = manqueEtape();
      if (manque) {
        const m = $('#msgf');
        if (m) { m.className = 'msg mal'; m.textContent = manque; }
        return;
      }
      ETAPE = Math.min(nbEtapes(), ETAPE + 1);
    } else if (ou === 'prec') {
      ETAPE = Math.max(1, ETAPE - 1);
    } else {
      ETAPE = Number(ou) || 1;
    }
    return rendre();
  }

  /* La grille de photos est unique, les packs sont plusieurs : on retient
     lequel attend sa photo. */
  const vign = e.target.closest('[data-photo]');
  if (vign) {
    lireEtape();
    PHOTO_POUR = Number(vign.dataset.photo);
    return rendre();
  }

  const plus = e.target.closest('[data-form-ajout]');
  if (plus) {
    lireEtape();
    EDITE.packs = (EDITE.packs || []).concat([{ unite: 'forfait' }]);
    return rendre();
  }
  const moins = e.target.closest('[data-form-sup]');
  if (moins) {
    lireEtape();
    EDITE.packs = (EDITE.packs || []);
    EDITE.packs.splice(Number(moins.dataset.formSup), 1);
    return rendre();
  }

  const rem = e.target.closest('[data-remise]');
  if (rem) return choisirRemise(rem);

  const img = e.target.closest('[data-img]');
  if (img && VUE === 'campagnes' && ETAPE === 1) {
    lireEtape();
    EDITE.visuel = img.dataset.img;
    return rendre();
  }
  if (img && PHOTO_POUR !== null) {
    lireEtape();
    EDITE.packs = EDITE.packs || [];
    if (EDITE.packs[PHOTO_POUR]) EDITE.packs[PHOTO_POUR].image = img.dataset.img;
    PHOTO_POUR = null;
    return rendre();
  }
  if (img) {
    [...$('#imgs').children].forEach((b) => b.classList.toggle('on', b === img));
    if (EDITE) { EDITE.fond = img.dataset.img; EDITE.format = 'fond'; }
    const a = $('#apercu');
    if (a) a.innerHTML = '<img src="' + srcImage(img.dataset.img) + '" alt="" '
      + 'style="max-width:210px;max-height:210px;object-fit:contain;'
      + 'background:var(--bark);border:1px solid var(--line)">';
    return;
  }
  if (e.target.id === 'annuler') { EDITE = null; return rendre(); }
  if (e.target.id === 'enreg') {
    const val = (id) => { const el = $('#' + id); return el ? el.value.trim() : ''; };
    if (VUE === 'campagnes') return enregistrerCampagne();
    if (VUE === 'promotions') return enregistrerPromo();
    const infos = [0, 1, 2, 3].map((i) => {
      const l = $('[data-il="' + i + '"]'), v = $('[data-iv="' + i + '"]');
      return [l ? l.value.trim() : '', v ? v.value.trim() : ''];
    }).filter((p) => p[0] && p[1]);
    const entree = {
      id: EDITE && EDITE.id, titre: val('f-titre'), accent: val('f-accent'),
      categorie: val('f-cat'), badge: val('f-badge'), texte: val('f-texte'),
      quand: val('f-quand'), fin: val('f-fin') || null, cta: val('f-cta'),
      href: val('f-href'), fond: (EDITE && EDITE.fond) || '',
      format: (EDITE && EDITE.format) || 'fond',
      publie: $('#f-publie').checked, infos,
    };
    const msg = $('#msgf');
    const r = await appel('enregistrer',
      { type: VUE === 'promotions' ? 'promotion' : 'evenement', entree });
    if (!r.ok) { msg.className = 'msg mal'; msg.textContent = r.message || 'Échec.'; return; }
    msg.className = 'msg bon'; msg.textContent = 'Enregistré.';
    EDITE = null;
    setTimeout(charger, 400);
  }
});

/* Depot d'une affiche.
   Le format se deduit des proportions : un visuel carre est une affiche —
   celles des reseaux portent deja dates, tarif et telephone — et se montre
   ENTIER. Un visuel large est une photo, et sert de fond. Rien a demander a
   l'utilisateur. */
/** Réduit un visuel trop grand pour l'usage qu'on en fait. Rend la donnée
    d'origine quand il n'y a rien à gagner : mieux vaut ne pas ré-encoder. */
function alleger(im, donnee, poids) {
  const MAX = 1400;
  if (!im) return donnee;
  const cote = Math.max(im.width, im.height);
  if (cote <= MAX && poids <= 400 * 1024) return donnee;
  const f = Math.min(1, MAX / cote);
  const c = document.createElement('canvas');
  c.width = Math.round(im.width * f);
  c.height = Math.round(im.height * f);
  const ctx = c.getContext('2d');
  /* Un PNG transparent deviendrait noir : on pose le fond du site dessous. */
  ctx.fillStyle = '#17100A';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(im, 0, 0, c.width, c.height);
  const reduit = c.toDataURL('image/jpeg', 0.85);
  // Si le ré-encodage ne gagne rien, on garde l'original.
  return reduit.length < donnee.length ? reduit : donnee;
}

document.addEventListener('change', async (ev) => {
  /* Mettre une chambre hors service, ou l'y remettre : ça part tout de
     suite, sans bouton à presser. Mais la case doit REVENIR EN ARRIÈRE si le
     serveur refuse, sinon elle affiche le contraire de ce qui est enregistré
     — et c'est une chambre qu'on croit fermée et qui se vend. */
  const boite = ev.target.closest('[data-service]');
  if (boite) {
    const ch = (ETAT.chambres || []).find((x) => x.id === boite.dataset.service);
    if (!ch) return;
    const voulu = boite.checked;
    const r = await appel('enregistrer', { type: 'chambre',
      entree: Object.assign({}, ch, { service: voulu }) });
    if (!r.ok) {
      boite.checked = !voulu;
      alert(r.message || "Le réglage n'a pas pu être enregistré.");
      return;
    }
    ETAT.chambres = ETAT.chambres.map((x) => (x.id === ch.id ? r.entree : x));
    return rendre();
  }

  if (ev.target.id !== 'f-fichier') return;
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  const aide = $('#aide-img');
  const dire = (t, mal) => { if (aide) { aide.textContent = t; aide.style.color = mal ? 'var(--err)' : ''; } };

  if (f.size > 4 * 1024 * 1024) {
    return dire('Affiche trop lourde : ' + (f.size / 1048576).toFixed(1) + ' Mo pour 4 Mo au maximum.', true);
  }
  dire('Envoi en cours…');
  const donnee = await new Promise((r) => {
    const l = new FileReader(); l.onload = () => r(l.result); l.readAsDataURL(f);
  });
  /* L'image est lue une fois : elle donne les proportions ET sert à
     l'alléger. */
  const im = await new Promise((r) => {
    const i = new Image();
    i.onload = () => r(i);
    i.onerror = () => r(null);
    i.src = donnee;
  });
  const q = im ? im.width / im.height : 1;
  const format = q > 0.8 && q < 1.25 ? 'affiche' : 'fond';

  /* Un visuel sort d'un téléphone ou d'un réseau : 2048 × 2048 et 400 Ko pour
     une carte de 265 pixels. Quatre packs pesaient 1,5 Mo — six fois la page
     d'accueil entière. On le réduit ici, avant l'envoi : ce qui n'est jamais
     déposé n'a jamais à être téléchargé par les visiteurs. */
  const envoi = alleger(im, donnee, f.size);
  if (envoi !== donnee) {
    const avant = Math.round(f.size / 1024);
    const apres = Math.round(envoi.length * 0.75 / 1024);
    dire('Envoi en cours… (' + avant + ' Ko allégés à ' + apres + ' Ko)');
  }
  const rep = await appel('televerser', { fichier: envoi });
  if (!rep.ok) return dire(rep.message || "Le dépôt a échoué.", true);
  EDITE = EDITE || { infos: [], publie: true };
  // La saisie de l etape en cours part dans EDITE avant que l apercu ne
  // soit remplace : deposer une image ne doit pas effacer un titre.
  if (VUE === 'promotions' || VUE === 'campagnes') lireEtape();

  if (CIBLE_DEPOT === 'pack') {
    EDITE.packs = EDITE.packs || [];
    if (EDITE.packs[PHOTO_POUR]) EDITE.packs[PHOTO_POUR].image = rep.url;
    PHOTO_POUR = null;
    CIBLE_DEPOT = 'fond';
    return rendre();
  }
  if (CIBLE_DEPOT === 'visuel') {
    EDITE.visuel = rep.url;
    CIBLE_DEPOT = 'fond';
    return rendre();
  }

  EDITE.fond = rep.url;
  EDITE.format = format;
  $('#apercu').innerHTML = '<img src="' + rep.url + '" alt="" '
    + 'style="max-width:210px;max-height:210px;object-fit:contain;'
    + 'background:var(--bark);border:1px solid var(--line)">';
  dire(format === 'affiche'
    ? 'Affiche déposée. Elle sera montrée entière, sans recadrage.'
    : 'Photo déposée. Elle servira de fond, derrière le texte.');
});

/* Au chargement : la session existe-t-elle deja ? */
appel('etat').then((r) => { if (r.ok) montrerCadre(); }).catch(() => {});
